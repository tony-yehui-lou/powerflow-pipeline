# Prefect deployments for the PowerFlow data pipelines.
# Run `uv run prefect deploy` to apply.

name: powerflow-pipeline
prefect-version: ">=3.7"

# One entry per pipeline, added when a pipeline lands under
# src/powerflow_pipeline/data/<pipeline>/flow.py.
deployments:
  - name: preprocess
    entrypoint: src/powerflow_pipeline/data/preprocess/flow.py:preprocess
    description: >-
      S0 ingest, S1 cut to the lift window, S2 orientation repair, S3 retilt to
      level with the floor, and S4 crop to a stable common region — every stream
      leaves portrait, rectified, and cropped — then S5 detects the barbell's cap
      and collar. The flow builds S5's detector from the promoted checkpoint itself,
      so the deployment needs nothing but these parameters.
    work_pool:
      name: local
    parameters:
      config:
        raw_root: ../data/raw
        record_root: ../data/s0_ingest_output
        cut_root: ../data/s1_cut_output
        retilt_root: ../data/s3_retilt_output
        crop_root: ../data/s4_crop_output
        output_root: ../data/s2_orient_output
        barbell_root: ../data/s5_barbell_output
        barbell_checkpoint: ../data/models/s5_barbell/frcnn-v2-2026-10-19.pt
        rotation: cw
